# The one Application applied by hand (deploy/bootstrap/vps2.sh); Argo CD takes everything
# else from deploy/apps in this repository.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/saculo/orqestrai
    targetRevision: main
    path: deploy/apps
    helm:
      valuesObject:
        revision: main # the same revision for every Application
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated: { prune: true, selfHeal: true }
