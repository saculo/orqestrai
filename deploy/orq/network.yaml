# orq serve takes calls only through the Tailscale proxy, and reaches only DNS and psql01.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: orq-serve
spec:
  podSelector: { matchLabels: { app: orq-serve } }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: tailscale } }
      ports: [{ port: 7400 }]
  egress:
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } }
      ports: [{ port: 53, protocol: UDP }, { port: 53, protocol: TCP }]
    - to:
        - ipBlock: { cidr: 95.217.1.116/32 } # psql01.mikr.us
      ports: [{ port: 5432 }]
