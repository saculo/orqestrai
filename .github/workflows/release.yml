name: release

# A tag v<version> (the version in package.json and plugin/.claude-plugin/plugin.json) builds orq
# as one executable, runs the whole test suite against that file, and attaches it to a release.
# It also pushes the image ghcr.io/saculo/orqestrai:<version>, which runs `orq serve`, and publishes
# the npm package orqestrai (`bun add -g orqestrai`) by npm trusted publishing: no token, npm
# trusts this workflow (npmjs.com, the package's settings, Trusted Publisher: saculo/orqestrai, release.yml).
# The plugin needs no build: Claude Code reads it from the repository at the tag.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # create the release
      packages: write # push the image
      id-token: write # npm trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: the tag is the version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          test "$TAG" = "v$(jq -r .version package.json)"
          test "$TAG" = "v$(jq -r .version plugin/.claude-plugin/plugin.json)"
      - name: build
        run: bun run build
      - name: tests, against the built file
        run: ORQ_BIN=dist/orq bun test
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          mv dist/orq dist/orq-linux-x64
          (cd dist && sha256sum orq-linux-x64 > orq-linux-x64.sha256)
          gh release create "$TAG" dist/orq-linux-x64 dist/orq-linux-x64.sha256 --title "$TAG" --generate-notes
      - name: image
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
        run: |
          image="ghcr.io/saculo/orqestrai:${TAG#v}"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          docker build -t "$image" .
          docker run --rm "$image" --version
          docker push "$image"
      - name: the npm package installs and runs
        run: |
          bun pm pack --destination "$RUNNER_TEMP"
          BUN_INSTALL="$RUNNER_TEMP/bun" bun add -g "$RUNNER_TEMP"/orqestrai-*.tgz
          "$RUNNER_TEMP/bun/bin/orq" --version
      # npm, not bun publish: only npm (11.5.1 or later, with Node 24) publishes by trusted publishing
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: npm
        run: npm publish --access public
