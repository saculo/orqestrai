name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  OPENGREP_VERSION: v1.30.2
  OPENGREP_SHA256: a66aa3278457f02b287b985a45b6762aebcaba5000f2689245fd1ed86d1456c7
  OPENGREP_RULES_COMMIT: f1d2b562b414783763fd02a6ed2736eaed622efa

jobs:
  check:
    name: types, lint, tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - name: types
        run: bun run check
      - name: lint and format (Biome)
        run: bunx biome ci .
      - name: tests
        run: bun test
      - name: module size (warns above ~150 lines)
        run: |
          for f in src/*.ts src/**/*.ts; do
            n=$(wc -l < "$f")
            if [ "$n" -gt 150 ]; then echo "::warning file=$f::$n lines, above the ~150 line budget"; fi
          done

  scan:
    name: security scans
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans the whole history
      - name: secrets (gitleaks)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: static analysis (Opengrep)
        run: |
          curl -fsSL -o /usr/local/bin/opengrep \
            "https://github.com/opengrep/opengrep/releases/download/${OPENGREP_VERSION}/opengrep_manylinux_x86"
          echo "${OPENGREP_SHA256}  /usr/local/bin/opengrep" | sha256sum -c -
          chmod +x /usr/local/bin/opengrep
          git init -q "$RUNNER_TEMP/rules"
          git -C "$RUNNER_TEMP/rules" fetch -q --depth 1 https://github.com/opengrep/opengrep-rules "$OPENGREP_RULES_COMMIT"
          git -C "$RUNNER_TEMP/rules" checkout -q FETCH_HEAD
          # Rule ids start with the rules path, so run from $RUNNER_TEMP and load them as rules/...
          # no-replaceall is about old browsers; orq runs on Bun.
          cd "$RUNNER_TEMP"
          W="$GITHUB_WORKSPACE"
          opengrep scan --error --quiet \
            --config rules/typescript --config rules/javascript --config rules/bash --config rules/yaml/github-actions \
            --exclude-rule "rules.javascript.lang.correctness.no-replaceall" \
            "$W/src" "$W/test" "$W/bin" "$W/.github"
      - name: workflows (actionlint)
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # 1.7.12
        with:
          args: -color
