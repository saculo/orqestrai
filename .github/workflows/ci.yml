name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: 8.28.0
  GITLEAKS_SHA256: a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb
  OPENGREP_VERSION: v1.30.2
  OPENGREP_SHA256: a66aa3278457f02b287b985a45b6762aebcaba5000f2689245fd1ed86d1456c7
  OPENGREP_RULES_COMMIT: f1d2b562b414783763fd02a6ed2736eaed622efa

jobs:
  check:
    name: types, lint, tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: types
        run: bun run check
      - name: lint and format (Biome)
        run: bunx biome ci .
      - name: tests
        run: bun test
      - name: the release binary builds and starts (the release job tests it fully)
        run: bun run build && dist/orq --version
      - name: module size (warns above ~150 lines)
        run: |
          for f in src/*.ts src/**/*.ts; do
            n=$(wc -l < "$f")
            if [ "$n" -gt 150 ]; then echo "::warning file=$f::$n lines, above the ~150 line budget"; fi
          done

  scan:
    name: security scans
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans the whole history
      # The binary, not gitleaks-action: the action scans `<first commit>^..HEAD`,
      # which fails when the first commit is the root.
      - name: secrets (gitleaks, whole history)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner .
      - name: static analysis (Opengrep)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/opengrep" \
            "https://github.com/opengrep/opengrep/releases/download/${OPENGREP_VERSION}/opengrep_manylinux_x86"
          echo "${OPENGREP_SHA256}  $RUNNER_TEMP/opengrep" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/opengrep"
          git init -q "$RUNNER_TEMP/rules"
          git -C "$RUNNER_TEMP/rules" fetch -q --depth 1 https://github.com/opengrep/opengrep-rules "$OPENGREP_RULES_COMMIT"
          git -C "$RUNNER_TEMP/rules" checkout -q FETCH_HEAD
          # Rule ids start with the rules path, so run from $RUNNER_TEMP and load them as rules/...
          # no-replaceall is about old browsers; orq runs on Bun.
          cd "$RUNNER_TEMP"
          W="$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/opengrep" scan --error --quiet \
            --config rules/typescript --config rules/javascript --config rules/bash --config rules/yaml/github-actions \
            --exclude-rule "rules.javascript.lang.correctness.no-replaceall" \
            "$W/src" "$W/test" "$W/bin" "$W/.github"
      - name: shell (shellcheck)
        run: shellcheck bin/orq
      - name: workflows (actionlint)
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # 1.7.12
        with:
          args: -color
